<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_11 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_11" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_11');
  const devicePixelRatio = window.devicePixelRatio || 1;
  /**
 * TALHA NURİ YILMAZ - KİŞİSEL AKADEMİK WEB SİTESİ
 * Ortak JavaScript Dosyası: main.js
 * Görevler:
 * 1. Dark Mode Açma/Kapama ve Tercihi Hafızada Tutma (localStorage)
 * 2. BibTeX Alıntılarını Tek Tıkla Panoya Kopyalama ve Toast Gösterimi
 * 3. Makale Okuma Sayfasında Dinamik İçindekiler (Scrollspy) Takibi
 */

document.addEventListener('DOMContentLoaded', () => {
  initThemeToggle();
  initBibTeXCopy();
  initScrollspy();
});

// 1. Dark Mode Geçişi
function initThemeToggle() {
  const toggleBtn = document.getElementById('theme-toggle-btn');
  const storedTheme = localStorage.getItem('site_theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  
  if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
    document.documentElement.setAttribute('data-theme', 'dark');
    if (toggleBtn) toggleBtn.textContent = '[ Aydınlık Mod ]';
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    if (toggleBtn) toggleBtn.textContent = '[ Koyu Mod ]';
  }

  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('site_theme', newTheme);
      toggleBtn.textContent = newTheme === 'dark' ? '[ Aydınlık Mod ]' : '[ Koyu Mod ]';
    });
  }
}

// 2. BibTeX Kopyalama ve Toast Bildirimi
function initBibTeXCopy() {
  const bibtexButtons = document.querySelectorAll('[data-copy-bibtex]');
  
  bibtexButtons.forEach(button => {
    button.addEventListener('click', (e) => {
      e.preventDefault();
      const bibtexText = button.getAttribute('data-copy-bibtex') || 
        `@article{yilmaz2024system,
  author = {Yılmaz, Talha Nuri},
  title = {Sistem Düzeyi Bürokrasi ve Blokzincir: Sokak Düzeyi Memurların Takdir Yetkisinin Akıllı Sözleşmelerle Yeniden Yapılanması},
  journal = {Çalışma Metinleri Serisi (Working Papers)},
  number = {WP-2024/03},
  year = {2024},
  institution = {Osmaniye Korkut Ata Üniversitesi}
}`;
      
      navigator.clipboard.writeText(bibtexText).then(() => {
        showToast('BibTeX atfı panoya kopyalandı.');
      }).catch(() => {
        showToast('Kopyalama başarısız oldu.');
      });
    });
  });
}

function showToast(message) {
  let toast = document.getElementById('toast-notice');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast-notice';
    toast.className = 'toast-notice';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.add('show');
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2800);
}

// 3. Okuma Sayfası Scrollspy (İçindekiler Takibi)
function initScrollspy() {
  const headings = document.querySelectorAll('.article-content h2, .article-content h3');
  const tocLinks = document.querySelectorAll('.toc-link');
  
  if (headings.length === 0 || tocLinks.length === 0) return;

  window.addEventListener('scroll', () => {
    let currentId = '';
    headings.forEach(heading => {
      const top = heading.getBoundingClientRect().top;
      if (top <= 120) {
        currentId = heading.getAttribute('id');
      }
    });

    tocLinks.forEach(link => {
      link.classList.remove('active');
      if (link.getAttribute('href') === `#${currentId}`) {
        link.classList.add('active');
      }
    });
  });
}

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_11 -->
</body>
</html>
